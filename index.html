    <button  class="btn2" onclick="next()"><i class="fa-solid fa-greater-than"></i></button>
    </div>
    <script>
        var items = document.querySelectorAll(".item");
       
        //console.log(items);
        var count=0;
        function next(){
            count++
            for(var data of items){
                data.style.transform = `translateX(-${count*180}px)`;
            } 
        }
         function pre(){
            count--
            for(var data of items){
                data.style.transform = `translateX(-${count*180}px)`;
            }
              
         }
    </script>
